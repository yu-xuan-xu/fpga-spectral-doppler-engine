<svg xmlns="http://www.w3.org/2000/svg" width="768" height="230" viewBox="0 0 768 230" role="img" aria-labelledby="title description">
  <title id="title">Doppler data path and AXI control</title>
  <desc id="description">AXI Stream supplies I/Q to a frame buffer, wall filter, Hann window, shared FFT, and peak estimator. AXI Lite controls the stream and observes results.</desc>
  <rect width="768" height="230" fill="#fff"/>
  <g fill="#161616" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
    <text x="24" y="33" font-size="18" font-weight="650">Spectral Doppler data path</text>
    <text x="24" y="63" font-size="14">AXI4-Stream I/Q input</text>
    <text x="744" y="63" font-size="14" text-anchor="end">AXI4-Stream result</text>
  </g>
  <g fill="#fff" stroke="#707070">
    <rect x="24" y="76" width="124" height="56"/>
    <rect x="173" y="76" width="124" height="56"/>
    <rect x="322" y="76" width="124" height="56"/>
    <rect x="471" y="76" width="124" height="56" fill="#eee"/>
    <rect x="620" y="76" width="124" height="56"/>
  </g>
  <g fill="none" stroke="#333" stroke-width="1.6">
    <path d="M148 104 H169 M164 100 L169 104 L164 108"/>
    <path d="M297 104 H318 M313 100 L318 104 L313 108"/>
    <path d="M446 104 H467 M462 100 L467 104 L462 108"/>
    <path d="M595 104 H616 M611 100 L616 104 L611 108"/>
  </g>
  <g fill="#161616" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle">
    <text x="86" y="101" font-weight="650">Frame buffer</text>
    <text x="86" y="120" font-size="12">validate 256 samples</text>
    <text x="235" y="101" font-weight="650">Wall filter</text>
    <text x="235" y="120" font-size="12">keep filter history</text>
    <text x="384" y="101" font-weight="650">Hann window</text>
    <text x="384" y="120" font-size="12">taper frame edges</text>
    <text x="533" y="101" font-weight="650">Shared FFT</text>
    <text x="533" y="120" font-size="12">256 points</text>
    <text x="682" y="101" font-weight="650">Peak estimate</text>
    <text x="682" y="120" font-size="12">signed bin, velocity</text>
  </g>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <path d="M86 164 V138 M82 143 L86 138 L90 143"/>
    <path d="M682 138 V164 M678 159 L682 164 L686 159"/>
  </g>
  <rect x="24" y="168" width="720" height="38" fill="#f4f4f4" stroke="#707070"/>
  <g fill="#161616" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13">
    <text x="37" y="192">enable and reset</text>
    <text x="384" y="192" font-weight="650" text-anchor="middle">AXI4-Lite registers</text>
    <text x="731" y="192" text-anchor="end">result snapshot and irq</text>
  </g>
</svg>
